<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Blueprint Gradient Background -->
    <linearGradient id="bpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5F4FF" />
      <stop offset="45%" stop-color="#F7FBFF" />
      <stop offset="100%" stop-color="#E5F4FF" />
    </linearGradient>

    <!-- Azure Accent Gradient -->
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#173C5B" />
      <stop offset="60%" stop-color="#399DD6" />
      <stop offset="100%" stop-color="#8CCDF2" />
    </linearGradient>

    <!-- Warm Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D49A32" />
      <stop offset="100%" stop-color="#E5A93C" />
    </linearGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="bpGridMajor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C9E9FC" stroke-width="1.2" />
      <path d="M 20 0 L 20 40 M 0 20 L 40 20" fill="none" stroke="#C9E9FC" stroke-width="0.5" stroke-dasharray="2,2" />
    </pattern>

    <!-- Subtle Dot Pattern -->
    <pattern id="dotPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#8CCDF2" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bpGrad)" />
  <rect width="1200" height="360" fill="url(#bpGridMajor)" />
  <rect width="1200" height="360" fill="url(#dotPattern)" />

  <!-- Architectural Crosshair Coordinate Ticks -->
  <g stroke="#399DD6" stroke-width="1.2">
    <line x1="40" y1="30" x2="40" y2="50" /><line x1="30" y1="40" x2="50" y2="40" />
    <line x1="1160" y1="30" x2="1160" y2="50" /><line x1="1150" y1="40" x2="1170" y2="40" />
    <line x1="40" y1="310" x2="40" y2="330" /><line x1="30" y1="320" x2="50" y2="320" />
    <line x1="1160" y1="310" x2="1160" y2="330" /><line x1="1150" y1="320" x2="1170" y2="320" />
  </g>

  <!-- Watermark Hanja / Kanji: 設計 (Design / Architecture) -->
  <text x="960" y="270" font-family="'Noto Sans JP', 'Segoe UI', sans-serif" font-weight="900" font-size="220" fill="#399DD6" opacity="0.06" text-anchor="middle">設計</text>

  <!-- Left Blueprint Banner Spine -->
  <polygon points="0,0 36,0 18,360 0,360" fill="#173C5B" />
  <polygon points="40,0 44,0 26,360 22,360" fill="#399DD6" />

  <!-- Top Technical Badges -->
  <rect x="70" y="38" width="190" height="26" fill="#173C5B" rx="3" />
  <text x="165" y="55" font-family="'Courier New', monospace" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">0xDAGI // BLUEPRINT</text>

  <rect x="270" y="38" width="190" height="26" fill="#FFFFFF" stroke="#173C5B" stroke-width="1.5" rx="3" />
  <text x="365" y="55" font-family="'Courier New', monospace" font-weight="bold" font-size="11" fill="#173C5B" text-anchor="middle" letter-spacing="1">PROJECT: ESTATE DEVELOPER</text>

  <rect x="470" y="38" width="130" height="26" fill="url(#goldGrad)" rx="3" />
  <text x="535" y="55" font-family="'Courier New', monospace" font-weight="bold" font-size="11" fill="#173C5B" text-anchor="middle" letter-spacing="1">VERIFIED ARCH</text>

  <!-- Main Headline Typography -->
  <text x="70" y="148" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="76" fill="#173C5B" letter-spacing="1">
    DAGMAWI <tspan fill="#399DD6">YOSEF</tspan>
  </text>

  <!-- Manhwa Onomatopoeia & Alias -->
  <text x="680" y="146" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="38" fill="#399DD6" letter-spacing="2">
    ダギ
  </text>
  <text x="760" y="146" font-family="'Courier New', monospace" font-weight="bold" font-size="28" fill="#E5A93C">
    [0xDAGI]
  </text>

  <!-- Subtitle Strip -->
  <text x="72" y="194" font-family="'Courier New', monospace" font-weight="bold" font-size="18" fill="#173C5B" letter-spacing="2.5">
    ARCHITECTURAL MANHWA <tspan fill="#399DD6">•</tspan> PRECAST BIM <tspan fill="#399DD6">•</tspan> CREATIVE 3D WEBGL
  </text>

  <!-- Creed Quote -->
  <text x="72" y="234" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#334155" letter-spacing="0.4">
    "Building ideas beyond the blueprint. Where drawings become structures and structures become interactive software."
  </text>
  <text x="72" y="258" font-family="'Courier New', monospace" font-size="13" fill="#399DD6" font-weight="bold">
    &gt; "First make it work, then make it right, then make it fast."
  </text>

  <!-- Bottom Technical Pills -->
  <g transform="translate(70, 288)">
    <rect x="0" y="0" width="180" height="32" fill="#FFFFFF" stroke="#173C5B" stroke-width="1.5" rx="4" />
    <circle cx="16" cy="16" r="4" fill="#399DD6" />
    <text x="30" y="21" font-family="'Courier New', monospace" font-weight="bold" font-size="11" fill="#173C5B">REVIT API &amp; PRECAST</text>

    <rect x="195" y="0" width="170" height="32" fill="#FFFFFF" stroke="#173C5B" stroke-width="1.5" rx="4" />
    <circle cx="211" cy="16" r="4" fill="#E5A93C" />
    <text x="225" y="21" font-family="'Courier New', monospace" font-weight="bold" font-size="11" fill="#173C5B">STRUCTURAL LAB</text>

    <rect x="380" y="0" width="185" height="32" fill="#FFFFFF" stroke="#173C5B" stroke-width="1.5" rx="4" />
    <circle cx="396" cy="16" r="4" fill="#22c55e" />
    <text x="410" y="21" font-family="'Courier New', monospace" font-weight="bold" font-size="11" fill="#173C5B">THREE.JS &amp; SHADERS</text>
  </g>

  <!-- Outer Architectural Drawing Border -->
  <rect x="6" y="6" width="1188" height="348" fill="none" stroke="#173C5B" stroke-width="2.5" />
  <rect x="12" y="12" width="1176" height="336" fill="none" stroke="#399DD6" stroke-width="1" stroke-dasharray="8,4" />
</svg>
